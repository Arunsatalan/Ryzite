    <script>
      // Safeguard against getter-only window.fetch assignment in restricted iframe/browser environments
      (function() {
        try {
          var _rawFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _activeFetch = _rawFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _activeFetch || _rawFetch;
            },
            set: function(newFetch) {
              _activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if already configurable or locked
        }
      })();
    </script>
